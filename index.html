<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Hay Festival Arequipa 2026 – Check-in</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 5px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    #resultado {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
    }

    button {
      padding: 14px 25px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      background: #222;
      color: white;
      margin: 10px;
    }

    .valido {
      color: green;
    }

    .error {
      color: red;
    }

    .advertencia {
      color: #d97706;
    }

    .datos {
      text-align: left;
      margin-top: 15px;
      line-height: 1.7;
    }

  </style>

</head>


<body>

  <h1>Hay Festival Arequipa 2026</h1>

  <p>Check-in</p>


  <button onclick="iniciarScanner()">
    📷 INICIAR CÁMARA
  </button>


  <div id="reader"></div>


  <div id="resultado">
    Pulsa el botón para iniciar la cámara.
  </div>


  <script>

    /* =====================================================
       URL DEL WEB APP DE GOOGLE APPS SCRIPT
       ===================================================== */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbziQCrSCikSMd27MZuTiyX9WrTWrJmZoTibWetaHv6ExwBaifqSWAzW6l52aL56Sz0S/exec";


    let scanner = null;
    let scannerActivo = false;
    let procesando = false;


    /* =====================================================
       INICIAR CÁMARA
       ===================================================== */

    function iniciarScanner() {

      if (scannerActivo) {
        return;
      }

      document.getElementById("resultado").innerHTML =
        "<p>Solicitando acceso a la cámara...</p>";

      scanner = new Html5Qrcode("reader");


      scanner.start(

        {
          facingMode: "environment"
        },

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          }

        },

        function(codigo) {

          if (procesando) {
            return;
          }

          procesando = true;

          scannerActivo = false;

          scanner.stop()
            .then(function() {

              qrEscaneado(codigo);

            })
            .catch(function() {

              qrEscaneado(codigo);

            });

        },

        function(error) {

          // Ignoramos los errores mientras busca el QR

        }

      )

      .then(function() {

        scannerActivo = true;

        document.getElementById("resultado").innerHTML =
          "<p>📷 <strong>Cámara activa</strong></p>" +
          "<p>Apunta al código QR del invitado.</p>";

      })

      .catch(function(error) {

        document.getElementById("resultado").innerHTML =
          "<h2 class='error'>❌ No se pudo acceder a la cámara</h2>" +
          "<p>Verifica los permisos de cámara del navegador.</p>";

      });

    }


    /* =====================================================
       QR DETECTADO
       ===================================================== */

    function qrEscaneado(codigo) {

      document.getElementById("resultado").innerHTML =
        "<p>🔎 Código detectado:</p>" +
        "<h2>" + codigo + "</h2>" +
        "<p>Verificando registro...</p>";


      consultarInvitado(codigo);

    }


    /* =====================================================
       CONSULTAR GOOGLE SHEETS
       ===================================================== */

    function consultarInvitado(codigo) {

      const callbackName =
        "respuesta_" + Date.now();


      window[callbackName] = function(resultado) {

        mostrarResultado(resultado);

        delete window[callbackName];

        const script =
          document.getElementById(callbackName);

        if (script) {
          script.remove();
        }

      };


      const script = document.createElement("script");

      script.id = callbackName;

      script.src =
        API_URL +
        "?action=buscar" +
        "&codigo=" +
        encodeURIComponent(codigo) +
        "&callback=" +
        callbackName;


      script.onerror = function() {

        document.getElementById("resultado").innerHTML =
          "<h2 class='error'>❌ Error de conexión</h2>" +
          "<p>No se pudo consultar el registro.</p>";

        procesando = false;

      };


      document.body.appendChild(script);

    }


    /* =====================================================
       MOSTRAR RESULTADO
       ===================================================== */

    function mostrarResultado(resultado) {

      if (!resultado.encontrado) {

        document.getElementById("resultado").innerHTML =
          "<h2 class='error'>❌ CÓDIGO NO REGISTRADO</h2>" +
          "<p>" +
          (resultado.mensaje || "El código no está registrado.") +
          "</p>" +
          "<button onclick='nuevoEscaneo()'>📷 NUEVO ESCANEO</button>";

        return;

      }


      /* ---------------------------------------------
         SI YA INGRESÓ
         --------------------------------------------- */

      if (resultado.estado === "Ingresó") {

        document.getElementById("resultado").innerHTML =

          "<h2 class='error'>⚠️ REGISTRO YA UTILIZADO</h2>" +

          "<div class='datos'>" +

          "<strong>Nombre:</strong> " +
          resultado.nombre +
          "<br>" +

          "<strong>Empresa:</strong> " +
          (resultado.empresa || "—") +
          "<br>" +

          "<strong>Código:</strong> " +
          resultado.codigo +

          "</div>" +

          "<p>Este código ya fue utilizado para ingresar.</p>" +

          "<button onclick='nuevoEscaneo()'>📷 NUEVO ESCANEO</button>";

        return;

      }


      /* ---------------------------------------------
         REGISTRO ENCONTRADO
         --------------------------------------------- */

      document.getElementById("resultado").innerHTML =

        "<h2>✅ INVITADO ENCONTRADO</h2>" +

        "<div class='datos'>" +

        "<strong>Nombre:</strong> " +
        resultado.nombre +
        "<br>" +

        "<strong>Empresa:</strong> " +
        (resultado.empresa || "—") +
        "<br>" +

        "<strong>Código:</strong> " +
        resultado.codigo +

        "</div>" +

        "<p>Registrando ingreso...</p>";


      registrarIngreso(resultado.codigo);

    }


    /* =====================================================
       REGISTRAR INGRESO
       ===================================================== */

    function registrarIngreso(codigo) {

      const callbackName =
        "registro_" + Date.now();


      window[callbackName] = function(resultado) {

        if (resultado.exito) {

          document.getElementById("resultado").innerHTML =

            "<h2 class='valido'>✅ INGRESO AUTORIZADO</h2>" +

            "<div class='datos'>" +

            "<strong>Nombre:</strong> " +
            resultado.nombre +
            "<br>" +

            "<strong>Empresa:</strong> " +
            (resultado.empresa || "—") +
            "<br>" +

            "<strong>Código:</strong> " +
            resultado.codigo +
            "<br>" +

            "<strong>Hora de ingreso:</strong> " +
            resultado.fechaIngreso +

            "</div>" +

            "<p>El ingreso ha sido registrado correctamente.</p>" +

            "<button onclick='nuevoEscaneo()'>📷 NUEVO ESCANEO</button>";

        }

        else {

          document.getElementById("resultado").innerHTML =

            "<h2 class='error'>⚠️ INGRESO NO AUTORIZADO</h2>" +

            "<p>" +
            (resultado.mensaje || "No se pudo registrar el ingreso.") +
            "</p>" +

            "<button onclick='nuevoEscaneo()'>📷 NUEVO ESCANEO</button>";

        }


        delete window[callbackName];

        const script =
          document.getElementById(callbackName);

        if (script) {
          script.remove();
        }

      };


      const script = document.createElement("script");

      script.id = callbackName;

      script.src =
        API_URL +
        "?action=registrar" +
        "&codigo=" +
        encodeURIComponent(codigo) +
        "&callback=" +
        callbackName;


      script.onerror = function() {

        document.getElementById("resultado").innerHTML =

          "<h2 class='error'>❌ ERROR DE CONEXIÓN</h2>" +

          "<p>No se pudo registrar el ingreso.</p>" +

          "<button onclick='nuevoEscaneo()'>📷 NUEVO ESCANEO</button>";

        procesando = false;

      };


      document.body.appendChild(script);

    }


    /* =====================================================
       NUEVO ESCANEO
       ===================================================== */

    function nuevoEscaneo() {

      procesando = false;

      document.getElementById("resultado").innerHTML =
        "<p>Listo para escanear otro código.</p>";

      iniciarScanner();

    }

  </script>

</body>

</html>
